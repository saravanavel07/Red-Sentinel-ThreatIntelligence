<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="none">
  <defs>
    <radialGradient id="eyeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF5C6C" stop-opacity="1" />
      <stop offset="60%" stop-color="#FF334F" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#FF334F" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#151A23" />
      <stop offset="100%" stop-color="#0E1219" />
    </linearGradient>
    <linearGradient id="strokeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF334F" />
      <stop offset="50%" stop-color="#292F3B" />
      <stop offset="100%" stop-color="#FF334F" />
    </linearGradient>
  </defs>

  <!-- Outer Protective Shield -->
  <path d="M120 18 L205 52 C205 142 165 198 120 222 C75 198 35 142 35 52 Z" fill="url(#shieldGrad)" stroke="url(#strokeGrad)" stroke-width="3.5" stroke-linejoin="round" />

  <!-- Inner Cyber Circuit Lines -->
  <path d="M55 70 L90 70 L105 85" stroke="#292F3B" stroke-width="1.5" stroke-linecap="round" />
  <circle cx="55" cy="70" r="2.5" fill="#FF334F" />
  <circle cx="105" cy="85" r="2" fill="#292F3B" />

  <path d="M185 70 L150 70 L135 85" stroke="#292F3B" stroke-width="1.5" stroke-linecap="round" />
  <circle cx="185" cy="70" r="2.5" fill="#FF334F" />
  <circle cx="135" cy="85" r="2" fill="#292F3B" />

  <path d="M60 145 L85 145 L100 160 L100 185" stroke="#292F3B" stroke-width="1.5" stroke-linecap="round" fill="none" />
  <circle cx="60" cy="145" r="2.5" fill="#292F3B" />
  <circle cx="100" cy="185" r="2" fill="#FF334F" />

  <path d="M180 145 L155 145 L140 160 L140 185" stroke="#292F3B" stroke-width="1.5" stroke-linecap="round" fill="none" />
  <circle cx="180" cy="145" r="2.5" fill="#292F3B" />
  <circle cx="140" cy="185" r="2" fill="#FF334F" />

  <!-- Hooded Hacker Silhouette -->
  <!-- Hood contour -->
  <path d="M120 54 C92 54 78 80 75 118 C75 148 88 172 120 184 C152 172 165 148 165 118 C162 80 148 54 120 54 Z" fill="#090B10" stroke="#292F3B" stroke-width="2" />
  
  <!-- Hood inner cowl shadow -->
  <path d="M120 62 C100 62 88 84 86 116 C86 142 98 162 120 172 C142 162 154 142 154 116 C152 84 140 62 120 62 Z" fill="#06070A" />

  <!-- Hacker Faceplate / Shadow with glowing red visor/eye accent -->
  <!-- Left visor slash -->
  <path d="M102 110 L114 113 L106 117 Z" fill="#FF334F" opacity="0.6" />
  <!-- Center-right glowing sentinel ocular accent -->
  <circle cx="128" cy="113" r="10" fill="url(#eyeGlow)" />
  <circle cx="128" cy="113" r="3.5" fill="#FFFFFF" />
  <path d="M124 113 L138 113" stroke="#FF5C6C" stroke-width="1.5" stroke-linecap="round" />

  <!-- Cybernetic Grid Chest / Neck collar -->
  <path d="M96 156 L120 164 L144 156" stroke="#FF334F" stroke-width="1.5" stroke-linecap="round" />
  <path d="M104 168 L120 174 L136 168" stroke="#292F3B" stroke-width="1.5" stroke-linecap="round" />
</svg>
